[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "chronorouter"
version = "0.1.0"
description = "Temporal-demand-aware model routing and graph-of-solutions orchestration for LLM/agent workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Amarel Taylor Scott" }]
keywords = ["llm", "routing", "agents", "temporal", "model-router", "cost-optimization"]
dependencies = []

[project.optional-dependencies]
openai-compatible = ["httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/chronorouter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
