name: Add / update a gateway
description: Suggest a new LLM gateway/router or a correction
labels: ["entry"]
body:
  - type: input
    id: name
    attributes: { label: Tool name }
    validations: { required: true }
  - type: input
    id: url
    attributes: { label: Repo or homepage URL }
    validations: { required: true }
  - type: textarea
    id: details
    attributes: { label: Org, category, open source?, license, what it does }
    validations: { required: true }
